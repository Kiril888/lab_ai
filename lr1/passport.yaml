# passport.yaml – паспорт експерименту
title: "Детектування та підрахунок будівельної техніки на майданчиках знесення і відбудови"
author: "Кузьмак Кіріл, група КНм-26"
created: "2026-11-06"
version: 1          # збільшувати при кожній зміні постановки
changelog:
  - {version: 1, date: "2026-11-06", note: "початкова постановка (ЛР1)"}

object:
  what: "будівельна техніка (самоскиди, екскаватори, навантажувачі, крани) на майданчику"
  scale: "майданчик 1–5 га"
  territory: "майданчики знесення/відбудови в Україні; навчальні сцени – відкриті ортофотоплани OAM"

decision:
  what: "оцінка інтенсивності робіт і потоку вивезення відходів; рішення про коригування графіка підрядника та логістики вивезення"
  user: "технічний нагляд замовника / міський департамент з питань відбудови"
  period: "щотижня"
  cost_of_errors: >
    FN (пропущений самоскид) занижує потік вивезення і маскує відставання підрядника;
    FP (купа, контейнер чи легковик як самоскид) завищує потік. Обидві помилки
    спотворюють показник приблизно симетрично, тому вимагаємо збалансованих P і R
    для класу «самоскид»; помилка підрахунку за тиждень <= 15 %.

indicator:
  name: "інтенсивність робіт I та оцінка маси вивезених відходів M"
  formula:
    I: "I = (1/T) * sum_t n_machines(t)  – середня кількість одиниць техніки на знімок"
    M: "M ≈ N_trips * V_body * k_fill * rho; N_trips ≈ n_trucks_loading * (t_shift / t_load)"
  units: {I: "од./знімок", M: "т/тиждень"}
  tolerance: "похибка підрахунку техніки <= 15 %; похибка M <= 30 % (через k_fill і rho)"
  link_to_circularity: "M дає m_total у формулі (1.1) R = (m_reuse+m_recycle+m_recover)/m_total"

research:
  question: "Чи дозволяє детектор, донавчений на відкритих аерознімках, підрахувати техніку на майданчику з похибкою <= 15 %?"
  hypothesis: "Донавчений детектор на знімках з GSD <= 0,1 м досягне recall і precision >= 0,85 для класу «самоскид»"
  refuted_if: "recall або precision < 0,85 на тестових сценах, або похибка підрахунку > 15 %"

task:
  type: "детектування об'єктів (рамки) + підрахунок"
  X: "RGB-плитка 640x640 пкс ортофотоплану (GSD 0,02–0,1 м)"
  Y: "множина рамок {(x0, y0, x1, y1, клас, впевненість)}"
  formal: "y_hat = f(x; theta); d = g(count(y_hat), c), c = норматив темпу робіт за графіком"
  classes: [dump_truck, excavator, loader, crane, other_vehicle]

data:
  sources:
    - {name: "OpenAerialMap", role: "основне джерело сцен", gsd_m: "0.02–0.1", license: "CC-BY 4.0 (перевіряти метадані сцени)"}
    - {name: "xView", role: "переднавчання (класи Dump Truck, Excavator, Mobile Crane, Front loader/Bulldozer)", gsd_m: 0.3, license: "CC BY-NC-SA 4.0"}
    - {name: "DOTA v1.5", role: "переднавчання детектора аерознімків (large/small vehicle)", license: "лише академічне використання"}
  channels: "RGB"
  min_object_m: 2.5
  required_gsd_m: 0.17      # GSD <= s_min / n_px = 2.5 / 15
  revisit: "щонайменше 2 рази на тиждень (вдвічі частіше за період рішення)"
  conditions: "денне світло, висота Сонця > 20°, без опадів; для супутника хмарність < 10 %"
  annotation: "CVAT, обмежувальні рамки (ЛР2)"

metrics:
  model: {mAP50: ">= 0.70", recall_dump_truck: ">= 0.85", precision_dump_truck: ">= 0.85"}
  indicator: {count_error: "<= 15 %"}
  baseline: "COCO-переднавчений детектор без донавчання (клас truck)"

plan:
  LR2: "набір 80–200 плиток з >= 4 сцен, таксономія, розмітка, групове розбиття"
  LR3: "класифікація фракцій відходів на плитках БПЛА (ViT-B/16, фокальна функція втрат) – за варіантом"
  LR4: "детектор RetinaNet (провали дахів і завали – за варіантом), дослідження роздільної здатності"
  resources: "Google Colab (T4 GPU), 2–3 тижні на роботу"

risks:
  - {risk: "мало сцен з технікою на OAM", measure: "додати xView для переднавчання; власне знімання за наявності дозволу"}
  - {risk: "тіні та перекриття техніки", measure: "аугментації яскравості; сцени різного часу доби"}
  - {risk: "плутанина екскаватор/навантажувач", measure: "уточнення інструкції з анотації, об'єднання класів при kappa < 0,6"}
  - {risk: "доменний зсув між країнами/сенсорами", measure: "групове розбиття за сценами, тест на окремих сценах"}
  - {risk: "обмеження польотів БПЛА у воєнний стан", measure: "використання відкритих архівних знімків"}
  - {risk: "ліцензії NC/SA", measure: "лише навчальне некомерційне використання, зазначення авторства"}

reproducibility:
  repo: "https://github.com/Kiril888/lab_ai"
  seed: 0
  env: "Python 3.10+, Colab; версії бібліотек фіксуються у requirements.txt"
  data_version: "manifest.csv з sha256 (ЛР2)"
